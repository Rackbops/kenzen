name: tests

# Kenzen CI (Tooling#478 K4-1), on GitHub-hosted `ubuntu-latest`. This is a
# `pull_request` workflow, so once the repo is public a fork PR runs arbitrary code in
# this job -- a self-hosted runner must never be attached under that trigger (the rule
# this workflow's own header used to cite in reverse, Tooling#437, only permitted
# self-hosted while the repo was private). GitHub-hosted runners are free for public
# repos and are the safe home for fork-triggered jobs. `pnpm run check` is the same gate
# as `just check` locally: Biome, then `-r typecheck`, then `-r test`.
on:
  pull_request:

# Squash-merge already validates the merge result, so CI runs on PRs only; cancel a
# superseded run when a new commit lands on the same PR.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install
        run: corepack enable && pnpm install --frozen-lockfile

      - name: Check (biome + typecheck + vitest)
        run: pnpm run check
