<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- kenzen#89: the Code Stream Koi mark, hex baked in. A favicon can't read CSS custom
       properties at all, so this is the one place in packages/web allowed literal brand colour
       (arcane-parchment's light-theme values), whitelisted explicitly by
       brand-hex-guard.test.ts. Uses KoiMark's own "small" element set (tail, body, spine glow,
       eye, no facets/trace/pectoral/dorsal) since a favicon is almost always rendered at
       16-32px, the exact size band that set exists for. -->
  <title>Kenzen</title>
  <path
    d="M14 32 C20 20 38 16 56 30 C58 31 58 33 56 34 C38 48 20 44 14 32 Z"
    fill="#6a4fe0"
    stroke="#191d26"
    stroke-width="1.6"
    stroke-linejoin="round"
  />
  <path
    d="M14 32 L4 21 C9 27 9 37 4 43 Z"
    fill="#6a4fe0"
    stroke="#191d26"
    stroke-width="1.6"
    stroke-linejoin="round"
  />
  <path
    d="M27 22.8 C34 15.5 43 15.5 52 24"
    fill="none"
    stroke="#1f9d57"
    stroke-width="2"
    stroke-linecap="round"
  />
  <circle cx="50" cy="28.5" r="2.4" fill="#191d26" />
  <circle cx="51" cy="27.7" r="0.8" fill="#f6f7f9" />
</svg>
